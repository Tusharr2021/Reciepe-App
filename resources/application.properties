# --- Server settings ---
# Render (and most cloud hosts) assign a port via the PORT environment
# variable at runtime. ${PORT:8080} means: use PORT if it's set, otherwise
# fall back to 8080 for local development.
server.port=${PORT:8080}

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:recipedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console ---
# Visit http://localhost:8080/h2-console while the app is running.
# Use JDBC URL: jdbc:h2:mem:recipedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
