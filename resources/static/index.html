<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Finder Dashboard</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1f2933; --muted: #6b7280;
    --primary: #ea580c; --primary-hover: #c2410c; --border: #e5e7eb;
    --done-bg: #f0fdf4; --done-text: #16a34a; --danger: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 32px 16px 60px;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p.subtitle { color: var(--muted); margin: 0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    font-weight: 600; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  .panel { display: none; }
  .panel.active { display: block; }

  form { display: flex; gap: 10px; background: var(--card); padding: 16px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  input[type="text"], input[type="number"], select, textarea {
    flex: 1; min-width: 120px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  button { cursor: pointer; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; padding: 10px 14px; white-space: nowrap; transition: background 0.15s ease; }
  form button, .btn-primary { background: var(--primary); color: white; }
  form button:hover, .btn-primary:hover { background: var(--primary-hover); }

  .ingredient-lines { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 10px; }
  .ingredient-line { display: flex; gap: 8px; }
  .btn-remove-line { background: #fee2e2; color: var(--danger); padding: 8px 10px; }
  .btn-add-line { background: #eef2ff; color: #4f46e5; align-self: flex-start; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
  th { background: #fafafa; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }

  .badge { padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.easy { background: var(--done-bg); color: var(--done-text); }
  .badge.medium { background: #fef3c7; color: var(--warn); }
  .badge.hard { background: #fee2e2; color: var(--danger); }

  .btn-delete { background: #fee2e2; color: var(--danger); padding: 6px 10px; font-size: 13px; }
  .btn-delete:hover { background: #fecaca; }

  .empty-state { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
  .error-banner { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }

  .match-bar-bg { background: #eef0f2; border-radius: 999px; height: 8px; overflow: hidden; width: 100px; }
  .match-bar-fill { background: var(--done-text); height: 100%; }
  .match-row { display: flex; align-items: center; gap: 8px; }
  .missing-list { color: var(--danger); font-size: 12px; margin-top: 4px; }

  .checklist {
    display: flex; flex-wrap: wrap; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .checklist label {
    display: flex; align-items: center; gap: 6px;
    background: #f9fafb; border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; user-select: none;
  }
  .checklist label:has(input:checked) { background: #ffedd5; border-color: var(--primary); color: var(--primary-hover); font-weight: 600; }
  .checklist input[type="checkbox"] { accent-color: var(--primary); }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Recipe Finder</h1>
      <p class="subtitle">Find recipes you can cook with what's already in your kitchen</p>
    </header>

    <div id="errorBanner" class="error-banner"></div>

    <div class="stats">
      <div class="stat-card"><div class="stat-value" id="statRecipes">0</div><div class="stat-label">Recipes</div></div>
      <div class="stat-card"><div class="stat-value" id="statIngredients">0</div><div class="stat-label">Known ingredients</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="find">Find Recipes</button>
      <button class="tab-btn" data-tab="recipes">Recipes</button>
      <button class="tab-btn" data-tab="ingredients">Ingredients</button>
    </div>

    <!-- FIND RECIPES PANEL -->
    <div class="panel active" id="panel-find">
      <form id="findForm" onsubmit="return false;">
        <input type="text" id="ingredientSearchInput" list="ingredientDatalist"
               placeholder="Type an ingredient (e.g. egg) to see matching recipes" autocomplete="off">
      </form>
      <datalist id="ingredientDatalist"></datalist>
      <table>
        <thead><tr><th>Recipe</th><th>Match</th><th>Missing</th><th>Time</th><th>Difficulty</th></tr></thead>
        <tbody id="recommendTableBody"></tbody>
      </table>
      <div id="recommendEmpty" class="empty-state">Type an ingredient above to see matching recipes.</div>
    </div>

    <!-- RECIPES PANEL -->
    <div class="panel" id="panel-recipes">
      <form id="recipeForm">
        <input type="text" id="recipeTitle" placeholder="Recipe title" required style="flex-basis:100%;">
        <input type="text" id="recipeCuisine" placeholder="Cuisine (e.g. Italian)">
        <select id="recipeDifficulty">
          <option value="EASY">Easy</option>
          <option value="MEDIUM">Medium</option>
          <option value="HARD">Hard</option>
        </select>
        <input type="number" id="recipeTime" placeholder="Cook time (min)" min="0" value="20">
        <textarea id="recipeInstructions" placeholder="Instructions" style="flex-basis:100%;"></textarea>

        <div class="ingredient-lines" id="ingredientLines">
          <div class="ingredient-line">
            <input type="text" class="ing-name" placeholder="Ingredient (e.g. egg)" required>
            <input type="text" class="ing-qty" placeholder="Quantity (e.g. 2)">
            <button type="button" class="btn-remove-line">✕</button>
          </div>
        </div>
        <button type="button" class="btn-add-line" id="addLineBtn">+ Add ingredient</button>
        <button type="submit" style="flex-basis:100%;">Add Recipe</button>
      </form>
      <table>
        <thead><tr><th>Title</th><th>Cuisine</th><th>Ingredients</th><th>Time</th><th>Difficulty</th><th></th></tr></thead>
        <tbody id="recipesTableBody"></tbody>
      </table>
      <div id="recipesEmpty" class="empty-state" style="display:none;">No recipes yet.</div>
    </div>

    <!-- INGREDIENTS PANEL -->
    <div class="panel" id="panel-ingredients">
      <form id="ingredientForm">
        <input type="text" id="newIngredientName" placeholder="Ingredient name (e.g. basil)" required>
        <button type="submit">Add Ingredient</button>
      </form>
      <table>
        <thead><tr><th>Name</th><th></th></tr></thead>
        <tbody id="ingredientsTableBody"></tbody>
      </table>
      <div id="ingredientsEmpty" class="empty-state" style="display:none;">No ingredients in the master list yet.</div>
    </div>
  </div>

<script>
  const RECIPES_URL = '/api/recipes';
  const INGREDIENTS_URL = '/api/ingredients';
  const RECOMMEND_URL = '/api/recommendations';

  const errorBanner = document.getElementById('errorBanner');
  let recipes = [];
  let ingredients = [];

  function showError(msg) { errorBanner.textContent = msg; errorBanner.style.display = 'block'; }
  function clearError() { errorBanner.style.display = 'none'; }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  async function loadAll() {
    try {
      clearError();
      const [recipesRes, ingredientsRes] = await Promise.all([fetch(RECIPES_URL), fetch(INGREDIENTS_URL)]);
      if (!recipesRes.ok || !ingredientsRes.ok) throw new Error('One or more requests failed');
      recipes = await recipesRes.json();
      ingredients = await ingredientsRes.json();
      document.getElementById('statRecipes').textContent = recipes.length;
      document.getElementById('statIngredients').textContent = ingredients.length;
      renderRecipes();
      renderIngredients();
      populateIngredientDatalist();
    } catch (err) {
      showError('Could not reach the API. Is the Spring Boot app running on port 8080? (' + err.message + ')');
    }
  }

  // --- Recipes ---
  function renderRecipes() {
    const tbody = document.getElementById('recipesTableBody');
    tbody.innerHTML = '';
    document.getElementById('recipesEmpty').style.display = recipes.length ? 'none' : 'block';

    recipes.forEach(recipe => {
      const tr = document.createElement('tr');
      const diffClass = (recipe.difficulty || '').toLowerCase();
      const ingredientList = (recipe.ingredients || [])
        .map(i => i.ingredient.name + (i.quantity ? ' (' + i.quantity + ')' : ''))
        .join(', ');

      tr.innerHTML = `
        <td class="cell-title"></td>
        <td class="cell-cuisine"></td>
        <td class="cell-ingredients"></td>
        <td>${recipe.cookingTimeMinutes} min</td>
        <td><span class="badge ${diffClass}">${recipe.difficulty || '—'}</span></td>
        <td><button class="btn-delete">Delete</button></td>
      `;
      tr.querySelector('.cell-title').textContent = recipe.title;
      tr.querySelector('.cell-cuisine').textContent = recipe.cuisine || '—';
      tr.querySelector('.cell-ingredients').textContent = ingredientList || '—';
      tr.querySelector('.btn-delete').addEventListener('click', () => deleteRecipe(recipe.id));
      tbody.appendChild(tr);
    });
  }

  document.getElementById('addLineBtn').addEventListener('click', () => {
    const wrap = document.getElementById('ingredientLines');
    const line = document.createElement('div');
    line.className = 'ingredient-line';
    line.innerHTML = `
      <input type="text" class="ing-name" placeholder="Ingredient (e.g. egg)" required>
      <input type="text" class="ing-qty" placeholder="Quantity (e.g. 2)">
      <button type="button" class="btn-remove-line">✕</button>
    `;
    line.querySelector('.btn-remove-line').addEventListener('click', () => line.remove());
    wrap.appendChild(line);
  });
  document.querySelectorAll('.btn-remove-line').forEach(btn =>
    btn.addEventListener('click', (e) => e.target.closest('.ingredient-line').remove())
  );

  document.getElementById('recipeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('recipeTitle').value.trim();
    const cuisine = document.getElementById('recipeCuisine').value.trim();
    const difficulty = document.getElementById('recipeDifficulty').value;
    const cookingTimeMinutes = parseInt(document.getElementById('recipeTime').value, 10) || 0;
    const instructions = document.getElementById('recipeInstructions').value.trim();

    const lines = Array.from(document.querySelectorAll('.ingredient-line')).map(line => ({
      ingredientName: line.querySelector('.ing-name').value.trim(),
      quantity: line.querySelector('.ing-qty').value.trim()
    })).filter(l => l.ingredientName);

    if (lines.length === 0) { showError('Add at least one ingredient.'); return; }

    try {
      clearError();
      const res = await fetch(RECIPES_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, cuisine, difficulty, cookingTimeMinutes, instructions, ingredients: lines })
      });
      if (!res.ok) throw new Error('Failed to add recipe (status ' + res.status + ')');
      e.target.reset();
      document.getElementById('ingredientLines').innerHTML = `
        <div class="ingredient-line">
          <input type="text" class="ing-name" placeholder="Ingredient (e.g. egg)" required>
          <input type="text" class="ing-qty" placeholder="Quantity (e.g. 2)">
          <button type="button" class="btn-remove-line">✕</button>
        </div>`;
      document.querySelector('.btn-remove-line').addEventListener('click', (ev) => ev.target.closest('.ingredient-line').remove());
      loadAll();
    } catch (err) { showError(err.message); }
  });

  async function deleteRecipe(id) {
    try {
      clearError();
      const res = await fetch(`${RECIPES_URL}/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Failed to delete recipe (status ' + res.status + ')');
      loadAll();
    } catch (err) { showError(err.message); }
  }

  // --- Ingredients ---
  function renderIngredients() {
    const tbody = document.getElementById('ingredientsTableBody');
    tbody.innerHTML = '';
    document.getElementById('ingredientsEmpty').style.display = ingredients.length ? 'none' : 'block';

    ingredients.forEach(ing => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="cell-name"></td><td><button class="btn-delete">Delete</button></td>`;
      tr.querySelector('.cell-name').textContent = ing.name;
      tr.querySelector('.btn-delete').addEventListener('click', () => deleteIngredient(ing.id));
      tbody.appendChild(tr);
    });
  }

  document.getElementById('ingredientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('newIngredientName').value.trim();
    try {
      clearError();
      const res = await fetch(INGREDIENTS_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      if (!res.ok) throw new Error('Failed to add ingredient (status ' + res.status + ')');
      e.target.reset();
      loadAll();
    } catch (err) { showError(err.message); }
  });

  async function deleteIngredient(id) {
    try {
      clearError();
      const res = await fetch(`${INGREDIENTS_URL}/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Failed to delete ingredient (status ' + res.status + ')');
      loadAll();
    } catch (err) { showError(err.message); }
  }

  // --- Find Recipes (recommendation) ---

  // Populate the datalist so the search box autocompletes from ingredients
  // that actually exist in the system.
  function populateIngredientDatalist() {
    const datalist = document.getElementById('ingredientDatalist');
    datalist.innerHTML = '';
    ingredients
      .slice()
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach(ing => {
        const option = document.createElement('option');
        option.value = ing.name;
        datalist.appendChild(option);
      });
  }

  // Debounce: wait briefly after the user stops typing before calling the API,
  // so we're not firing a request on every single keystroke.
  let searchDebounceTimer = null;
  const searchInput = document.getElementById('ingredientSearchInput');

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    const query = searchInput.value.trim();

    if (!query) {
      document.getElementById('recommendTableBody').innerHTML = '';
      const empty = document.getElementById('recommendEmpty');
      empty.style.display = 'block';
      empty.textContent = 'Type an ingredient above to see matching recipes.';
      return;
    }

    searchDebounceTimer = setTimeout(() => searchByIngredient(query), 300);
  });

  async function searchByIngredient(query) {
    try {
      clearError();
      const res = await fetch(RECOMMEND_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ availableIngredients: [query] })
      });
      if (!res.ok) throw new Error('Failed to get recommendations (status ' + res.status + ')');
      const results = await res.json();
      renderRecommendations(results, query);
    } catch (err) { showError(err.message); }
  }

  function renderRecommendations(results, query) {
    const tbody = document.getElementById('recommendTableBody');
    tbody.innerHTML = '';
    document.getElementById('recommendEmpty').style.display = results.length ? 'none' : 'block';
    if (results.length === 0) {
      document.getElementById('recommendEmpty').textContent = 'No matching recipes found — try adding some recipes first, or different ingredients.';
    }

    results.forEach(r => {
      const recipe = r.recipe;
      const pct = Math.round(r.matchPercentage);
      const diffClass = (recipe.difficulty || '').toLowerCase();
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="cell-title"></td>
        <td>
          <div class="match-row">
            <div class="match-bar-bg"><div class="match-bar-fill" style="width:${pct}%"></div></div>
            <span>${pct}% (${r.matchedCount}/${r.totalRequired})</span>
          </div>
        </td>
        <td class="cell-missing"></td>
        <td>${recipe.cookingTimeMinutes} min</td>
        <td><span class="badge ${diffClass}">${recipe.difficulty || '—'}</span></td>
      `;
      tr.querySelector('.cell-title').textContent = recipe.title;
      const missingCell = tr.querySelector('.cell-missing');
      missingCell.textContent = r.missingIngredients.length ? r.missingIngredients.join(', ') : 'None — you have everything!';
      if (r.missingIngredients.length) missingCell.classList.add('missing-list');
      tbody.appendChild(tr);
    });
  }

  loadAll();
</script>
</body>
</html>
