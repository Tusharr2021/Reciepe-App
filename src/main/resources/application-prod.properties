# This file is only used when the "prod" Spring profile is active
# (set SPRING_PROFILES_ACTIVE=prod as an environment variable on Render).
# Locally, Eclipse/Maven use application.properties (H2) instead - nothing
# changes about how you run this project on your own machine.

# --- PostgreSQL connection ---
# These three values come from environment variables you set in Render's
# dashboard (Environment tab), NOT hardcoded here - so your real database
# credentials never get committed to GitHub.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# The H2 web console is for local development only - disable it in production
spring.h2.console.enabled=false
